<title>Painel Conamore · Marketing e Vendas</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root{ --laranja:#FF6900; --ink:#171A1F; --mute:#8A919E; --hair:#EEF0F3; --card:#fff; --ground:#F8F9FB; --desce:#C43E3E }
  *{ box-sizing:border-box }
  html,body{ margin:0; min-height:100% }
  body{ font-family:'Hanken Grotesk',system-ui,sans-serif; background:var(--ground); color:var(--ink); display:flex; flex-direction:column; min-height:100vh }
  .topo{ background:#1A1A1A; border-bottom:3px solid var(--laranja); height:72px; display:flex; align-items:center; justify-content:center }
  .topo img{ height:36px; width:auto }
  main{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px 16px }
  .gbox{ width:100%; max-width:360px; background:var(--card); border:1px solid var(--hair); border-radius:20px; padding:32px 28px; text-align:center }
  .gbox h1{ font-size:19px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em }
  .gbox p{ font-size:13px; color:var(--mute); margin:0 0 22px }
  form{ display:flex; flex-direction:column; gap:10px }
  #gpin{ font:inherit; font-size:20px; padding:11px 14px; border:1px solid var(--hair); border-radius:12px; text-align:center; letter-spacing:.3em; background:var(--ground); color:var(--ink) }
  #gpin:focus{ outline:2px solid var(--laranja); outline-offset:1px; background:var(--card) }
  #gbtn{ font:inherit; font-size:14px; font-weight:600; height:42px; border:0; border-radius:999px; background:var(--ink); color:#fff; cursor:pointer }
  #gbtn:disabled{ opacity:.55; cursor:default }
  #gerr{ min-height:18px; font-size:12.5px; margin-top:10px; color:var(--mute) }
  #gerr.bad{ color:var(--desce) }
  .credito{ text-align:center; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); padding:18px }
</style>
</head>

<main><div class="gbox">
  <h1>Marketing e Vendas</h1>
  <p>Painel de acompanhamento · acesso por PIN</p>
  <form id="gform" autocomplete="off">
    <input id="gpin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="PIN" aria-label="PIN de acesso">
    <button type="submit" id="gbtn">Entrar</button>
  </form>
  <div id="gerr"></div>
</div></main>
<div class="credito">por Communitas</div>
<script>
(function(){
  var ITER=310000;
  var err=document.getElementById('gerr'), btn=document.getElementById('gbtn'), inp=document.getElementById('gpin');
  function say(m,bad){ err.textContent=m||''; err.className=bad?'bad':''; }
  async function unlock(pin){
    btn.disabled=true; say('Abrindo o painel...');
    var buf;
    try{
      var r=await fetch('dados.enc',{cache:'no-store'});
      if(!r.ok) throw new Error('rede');
      buf=new Uint8Array(await r.arrayBuffer());
    }catch(e){ say('Não foi possível carregar o painel. Tente de novo.',true); btn.disabled=false; return; }
    try{
      var salt=buf.slice(0,16), iv=buf.slice(16,28), ct=buf.slice(28);
      var km=await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'}, km, {name:'AES-GCM',length:256}, false, ['decrypt']);
      var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv}, key, ct));
      try{ sessionStorage.setItem('conamore_pin', pin); }catch(e){}
      document.open(); document.write(html); document.close();
    }catch(e){
      try{ sessionStorage.removeItem('conamore_pin'); }catch(_){}
      say('PIN incorreto.',true); btn.disabled=false; inp.value=''; inp.focus();
    }
  }
  document.getElementById('gform').addEventListener('submit', function(ev){ ev.preventDefault(); var v=inp.value.trim(); if(v) unlock(v); });
  var saved=null; try{ saved=sessionStorage.getItem('conamore_pin'); }catch(e){}
  if(saved){ unlock(saved); } else { inp.focus(); }
})();
</script>
